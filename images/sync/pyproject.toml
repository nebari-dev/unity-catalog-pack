[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uc-keycloak-sync"
version = "0.1.0"
description = "Mirror Keycloak group members into Unity Catalog users and metastore privileges"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32,<3",
  "PyJWT[crypto]>=2.9,<3",
]

[project.optional-dependencies]
test = ["pytest>=8", "responses>=0.25"]

[project.scripts]
uc-keycloak-sync = "uc_keycloak_sync.main:main"

[tool.setuptools.packages.find]
include = ["uc_keycloak_sync*"]
